<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guías de Oración - Saborea Cada Palabra</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --font-body: 'Lora', serif;
            --c-stone-900: #1c1917;
            --c-stone-800: #292524;
            --c-stone-700: #44403c;
            --c-stone-600: #57534e;
            --c-stone-500: #78716c;
            --c-stone-400: #a8a29e;
            --c-stone-300: #d6d3d1;
            --c-stone-200: #e7e5e4;
            --c-stone-100: #f5f5f4;
            --c-amber-100: #fef3c7;
            --c-amber-200: #fde68a;
            --c-amber-500: #f59e0b;
            --c-amber-600: #d97706;
            --c-rose-500: #f43f5e;
            --c-emerald-600: #059669;
            --c-white: #ffffff;
            --c-black: #000000;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: var(--font-sans);
            background-color: var(--c-stone-900);
            color: var(--c-stone-900);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        ::selection {
            background-color: rgba(253, 230, 138, 0.5); /* amber-200/50 */
            color: var(--c-stone-900);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        button, input, textarea {
            font-family: inherit;
            border: none;
            background: none;
            cursor: pointer;
        }

        input, textarea {
            cursor: text;
        }

        .container {
            max-width: 1024px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .text-center { text-align: center; }
        .text-left { text-align: left; }
        
        .grid-home {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        @media (min-width: 1024px) {
            .grid-home { grid-template-columns: repeat(2, 1fr); }
        }

        .fixed-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-color: var(--c-stone-900);
        }
        
        .overlay-gradient {
            position: absolute;
            inset: 0;
            transition: opacity 1s ease-in-out;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1.5s ease-in-out;
            opacity: 0.3;
        }
        
        .mix-blend-overlay { mix-blend-mode: overlay; }
        
        .backdrop-blur-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(28, 25, 23, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .gradient-bottom {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent, rgba(28, 25, 23, 0.6));
        }

        .fade-in { animation: fadeIn 1s ease-out forwards; }
        .slide-up { animation: slideUp 1s ease-out forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .offer-animation {
            animation: offerUp 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes offerUp {
            0% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
            40% { transform: translateY(-20px) scale(1.02); opacity: 0.8; filter: blur(1px); color: var(--c-amber-500); }
            100% { transform: translateY(-80px) scale(0.9); opacity: 0; filter: blur(15px); color: var(--c-amber-200); }
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .color-bg-home {
            background: linear-gradient(-45deg, #4b6cb7, #182848, #2a5298, #0f2027);
            background-size: 400% 400%;
            animation: gradientBG 30s ease infinite;
        }

        .home-layout {
            padding: 4rem 1.5rem 6rem;
        }
        .hero-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 5rem;
            height: 5rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 0.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .hero-title {
            font-family: var(--font-serif);
            font-size: 3rem;
            color: var(--c-white);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.025em;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        @media (min-width: 768px) { .hero-title { font-size: 4.5rem; } }
        
        .divider {
            height: 1px;
            width: 10rem;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);
            margin: 2.5rem auto;
        }

        .hero-quote {
            font-family: var(--font-body);
            color: rgba(255,255,255,0.9);
            font-size: 1.25rem;
            font-style: italic;
            max-width: 48rem;
            margin: 0 auto;
            line-height: 1.625;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        @media (min-width: 768px) { .hero-quote { font-size: 1.7rem; } }

        .hero-author {
            font-family: var(--font-sans);
            color: rgba(255,255,255,0.6);
            font-size: 0.75rem;
            margin-top: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-weight: 600;
        }
        @media (min-width: 768px) { .hero-author { font-size: 0.875rem; } }

        .welcome-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 1.5rem;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            margin: 0 auto 5rem;
            max-width: 56rem;
            text-align: center;
        }
        @media (min-width: 768px) { .welcome-box { padding: 2.5rem; } }

        .day-card {
            display: block;
            width: 100%;
            text-align: left;
            padding: 2rem;
            border-radius: 2.5rem;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 40px 0 rgba(0,0,0,0.3);
        }
        @media (min-width: 768px) { .day-card { padding: 2.5rem; } }
        
        .day-card:hover {
            box-shadow: 0 20px 50px 0 rgba(255,255,255,0.15);
            transform: translateY(-8px);
        }

        .day-card-bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 0;
            mix-blend-mode: overlay;
        }
        .day-card:hover .day-card-bg-layer { opacity: 0.3; }

        .day-card-gradient-layer {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(28,25,23,0.6), transparent);
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 0;
        }
        .day-card:hover .day-card-gradient-layer { opacity: 1; }

        .day-card-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .day-card-eyebrow {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
        }
        @media (min-width: 768px) { .day-card-eyebrow { font-size: 0.75rem; } }

        .day-card-title {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            line-height: 1.25;
            color: var(--c-white);
            font-weight: 700;
            transition: color 0.3s;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
        }
        @media (min-width: 768px) { .day-card-title { font-size: 1.875rem; } }
        .day-card:hover .day-card-title { color: var(--c-amber-100); }

        .day-card-subtitle {
            font-family: var(--font-body);
            color: rgba(255,255,255,0.8);
            font-size: 0.875rem;
            padding-left: 5.5rem;
            line-height: 1.625;
            font-style: italic;
            margin-bottom: 1rem;
        }
        @media (min-width: 768px) { .day-card-subtitle { font-size: 1rem; } }

        .icon-3d-wrapper {
            position: relative;
            border-radius: 1rem;
            padding: 2px;
            transition: all 0.3s;
            flex-shrink: 0;
            z-index: 10;
        }
        .icon-3d-normal { width: 3.5rem; height: 3.5rem; }
        .icon-3d-large { width: 5rem; height: 5rem; }
        
        .icon-3d-inner {
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }
        .day-card:hover .icon-3d-wrapper {
            transform: scale(1.1) translateY(-4px);
        }
        .icon-shadow { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .day-layout {
            padding: 1rem 1rem 9rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .nav-header {
            position: relative;
            z-index: 50;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border-radius: 9999px;
            padding: 1rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
        }
        @media (min-width: 768px) { .nav-header { padding: 1rem 2rem; } }

        .btn-back {
            font-family: var(--font-sans);
            color: var(--c-white);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(255,255,255,0.1);
            padding: 0.625rem 1.25rem;
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        @media (min-width: 768px) { .btn-back { font-size: 0.875rem; } }
        .btn-back:hover {
            color: var(--c-amber-200);
            background: rgba(255,255,255,0.2);
        }

        .header-title {
            font-family: var(--font-sans);
            color: var(--c-white);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
            opacity: 0.9;
            text-align: center;
        }
        @media (min-width: 768px) { .header-title { font-size: 0.875rem; } }

        .steps-container-wrapper { padding: 0 0.5rem; margin-bottom: 2.5rem; }
        @media (min-width: 768px) { .steps-container-wrapper { padding: 0 4rem; } }
        
        .steps-container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 9999px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        
        .steps-line {
            position: absolute;
            left: 2.5rem;
            right: 2.5rem;
            top: 50%;
            height: 2px;
            background: rgba(255,255,255,0.2);
            z-index: 0;
            border-radius: 9999px;
            transform: translateY(-50%);
        }

        .step-circle {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.7s;
            border: 1px solid;
            position: relative;
        }
        @media (min-width: 768px) { .step-circle { width: 3rem; height: 3rem; } }
        
        .step-future {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
            border-color: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
        }
        
        .step-past {
            background: rgba(255,255,255,0.8);
            color: var(--c-stone-800);
            border-color: rgba(255,255,255,0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }
        
        .step-active {
            color: var(--c-white);
            transform: scale(1.3) translateY(-6px);
            border-color: rgba(255,255,255,0.4);
            z-index: 20;
        }
        
        .main-panel {
            flex-grow: 1;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 3rem;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        @media (min-width: 768px) { .main-panel { padding: 4rem; } }

        .panel-indicator {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10rem;
            height: 0.375rem;
            background: linear-gradient(to right, transparent, rgba(168,162,158,0.6), transparent);
            border-bottom-left-radius: 9999px;
            border-bottom-right-radius: 9999px;
        }

        .main-title {
            font-family: var(--font-serif);
            font-size: 1.875rem;
            text-align: center;
            color: var(--c-stone-900);
            margin-bottom: 3.5rem;
            font-weight: 700;
            letter-spacing: 0.025em;
            opacity: 0.95;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.05));
        }
        @media (min-width: 768px) { .main-title { font-size: 2.5rem; } }

        /* Utilidades para los pasos de contenido */
        .content-stack { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3.5rem; }
        .content-stack-wide { max-width: 56rem; margin: 0 auto; display: flex; flex-direction: column; gap: 4rem; }
        
        .text-body-lg {
            font-family: var(--font-body);
            font-size: 1.25rem;
            color: var(--c-stone-800);
            line-height: 2;
            max-width: 48rem;
            text-wrap: balance;
        }
        @media (min-width: 768px) { .text-body-lg { font-size: 1.4rem; } }

        .breath-container {
            position: relative;
            width: 18rem;
            height: 18rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 3rem 0;
        }

        .breath-ring-1 {
            position: absolute; inset: 0;
            border-radius: 50%;
            filter: blur(24px);
            transition: all 4000ms ease-in-out;
        }
        .breath-ring-2 {
            position: absolute; inset: 1.5rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(16px);
            box-shadow: 0 0 50px rgba(255,255,255,0.9);
            transition: all 4000ms ease-in-out;
        }
        .breath-ring-3 {
            position: absolute; inset: 3rem;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.9);
            transition: all 4000ms ease-in-out;
        }
        .breath-center {
            position: relative; z-index: 10;
            width: 9rem; height: 9rem;
            border-radius: 50%;
            background: linear-gradient(to bottom right, var(--c-white), var(--c-stone-100));
            box-shadow: 15px 15px 30px rgba(0,0,0,0.1), -15px -15px 30px rgba(255,255,255,0.9);
            display: flex; align-items: center; justify-content: center;
            border: 3px solid var(--c-white);
            transition: all 4000ms ease-in-out;
        }
        
        .breath-text {
            font-family: var(--font-sans);
            color: var(--c-stone-700);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .breath-inhale .breath-ring-1 { transform: scale(1.15); opacity: 0.5; }
        .breath-exhale .breath-ring-1 { transform: scale(0.5); opacity: 0.1; }
        .breath-inhale .breath-ring-2 { transform: scale(1.05); }
        .breath-exhale .breath-ring-2 { transform: scale(0.75); }
        .breath-inhale .breath-ring-3 { transform: scale(1); opacity: 1; }
        .breath-exhale .breath-ring-3 { transform: scale(0.5); opacity: 0; }
        .breath-inhale .breath-center { transform: scale(1.05); }
        .breath-exhale .breath-center { transform: scale(0.95); opacity: 0.8; }

        .info-pill {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            color: var(--c-stone-600);
            font-weight: 600;
            background: rgba(255,255,255,0.5);
            padding: 1rem 2rem;
            border-radius: 9999px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.6);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            z-index: 10;
            position: relative;
        }
        @media (min-width: 768px) { .info-pill { font-size: 0.875rem; } }

        .content-box-light {
            background: linear-gradient(to bottom right, rgba(255,255,255,0.6), rgba(255,255,255,0.3));
            padding: 2rem;
            border-radius: 2.5rem;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        @media (min-width: 768px) { .content-box-light { padding: 3rem; } }
        
        .content-box-inset {
            background: rgba(255,255,255,0.5);
            padding: 3rem;
            border-radius: 3.5rem;
            box-shadow: inset 0 0 50px rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.8);
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 768px) { .content-box-inset { padding: 5rem; } }

        .canto-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
            width: 100%;
            margin-top: 1.5rem;
        }
        @media (min-width: 1280px) { .canto-grid { grid-template-columns: repeat(2, 1fr); } }

        .canto-card {
            background: rgba(255,255,255,0.5);
            padding: 2rem;
            border-radius: 2.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.5s;
        }
        .canto-card:hover { transform: translateY(-6px); }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            border: 4px solid rgba(255,255,255,0.6);
            margin-bottom: 2rem;
            background: var(--c-stone-200);
            position: relative;
        }
        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.05);
            transition: background-color 0.3s;
            pointer-events: none;
            z-index: 10;
        }
        .video-box:hover .video-overlay { background: transparent; }
        
        .lyrics-box {
            background: rgba(255,255,255,0.6);
            padding: 2rem;
            border-radius: 2rem;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: inset 0 2px 15px rgba(255,255,255,0.9);
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grace-quote {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            color: var(--c-stone-900);
            line-height: 1.6;

            dialogo: [
                { id: 'd1_1', label: "Señor, al intentar dejar que estas palabras traspasen mis muros, confieso que lo que más me cuesta creer sobre mí mismo es..." },
                { id: 'd1_2', label: "Pero cuando me rindo y acepto que tu mirada sobre mí es de pura ternura, mi alma siente..." }
            ],
            oracionFinal: "Señor, gracias por amarme tal como soy, antes de cualquier logro o mérito de mi parte. Sella esta profunda verdad en mi corazón para que camine hoy con la frente en alto y el alma en paz.",
            compromiso: "Hoy me comprometo a no mendigar valor en la aprobación ajena. Si me sorprendo buscando agradar por miedo al rechazo, me detendré y recordaré la ternura de tu mirada sobre mí."
        },
        {
            id: 2,
            title: "Soltar el control y encontrar descanso",
            subtitle: "Cambiar la carga del perfeccionismo por el yugo suave del amor.",
            icon: "wind",
            theme: "theme-2",
            bgImage: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs2, cantosDB.le2],
            preparacion: "Toma consciencia de tu propio cuerpo. ¿Dónde sientes tensión en este momento? ¿Acaso en los hombros, en el cuello, en la mandíbula apretada? Esas tensiones físicas son el eco resonante del peso mental que llevas. Imagina que cargas una mochila repleta de piedras pesadas: son tus preocupaciones incesantes, la necesidad compulsiva de que todo salga perfecto, el temor al futuro incierto. Al comenzar este rato, visualiza cómo te quitas esa mochila y la dejas, con un profundo suspiro de alivio, a los pies del Maestro. Él te mira, sabiendo exactamente cuánto pesa.",
            peticion: "Jesús, concédeme la gracia de la humildad para reconocer mis límites humanos. Enséñame a soltar el afán agotador de controlarlo todo y permíteme experimentar tu alivio profundo.",
            cita: '"Vengan a mí todos los que están cansados y agobiados, y yo los aliviaré. Carguen con mi yugo y aprendan de mí, que soy manso y humilde de corazón, y encontrarán descanso para sus almas." (Mateo 11, 28-29)',
            saboreo: "Observa el agudo contraste: el mundo constantemente te exige 'esfuérzate más', 'tienes que poder con todo', 'no te detengas jamás'. Jesús, en cambio, te dice suavemente: 'ven a mí'. Fíjate en la palabra agobiados. El agotamiento más letal no siempre es el físico, sino la fatiga emocional de sostener el mundo entero en tus manos. Jesús no te promete suprimir el trabajo, sino que te ofrece un 'yugo' compartido. Llevar la vida junto a Él hace que la carga cambie de naturaleza; se vuelve un caminar acompañado, un esfuerzo sostenido por la gracia.\n\nConsidera también cómo este 'yugo' compartido transforma tu mirada sobre los imprevistos de la vida diaria. Cuando intentas controlar cada minúsculo detalle, un simple cambio de planes se vive como una tragedia que agota tus reservas. Cuando caminas junto al Maestro, el imprevisto se convierte en una oportunidad para confiar en Su providencia. Suelta el timón por un momento hoy y experimenta la ligereza liberadora de saber que el universo sigue su curso sin que tengas que empujarlo constantemente con tus propias y limitadas fuerzas.",
            tituloPoema: "Salmo de las Manos Abiertas",
            oracionPoetica: "Dios de las manos siempre abiertas,\nenséñame a conjugar el difícil verbo 'soltar'.\nSálvame de mi adicción a tenerlo todo atado,\nde mi falsa ilusión de omnipotencia.\n\nMe creo el pilar que sostiene mi pequeño universo,\ny el peso de las mañanas me quiebra la espalda.\nMe angustia el futuro, me pesa el pasado,\ny en este afán de controlarlo todo, se me escapa la vida.\n\nHoy quiero dimitir de mi cargo de gerente del mundo,\ny sentarme a tus pies, pequeño y vulnerable,\nsabiendo que tu yugo es suave,\ndejando que Tú, y solo Tú, sostengas mis horas.\n\nDame la gracia de la debilidad aceptada,\nel valor de decir 'no puedo' sin sentirme vencido.\nQue encuentre en mi fragilidad la puerta de entrada\npara que tu fuerza divina se instale en mi pobreza.\n\nQuiero despertar mañana sin la agenda como espada,\nsin el reloj dictando ansioso el valor de mis horas.\nQuiero aprender a fluir como el río en tu cauce,\nseguro de que me llevas al mar de tu inmensa paz.",
            dialogo: [
                { id: 'd2_1', label: "Jesús, hoy vengo a ti sumamente cansado/a. Si miro debajo de mi hiperactividad, mi mayor agobio oculto es..." },
                { id: 'd2_2', label: "Te entrego esta necesidad de controlarlo todo. Para aprender a llevar la vida a tu ritmo compasivo, te pido que..." }
            ],
            oracionFinal: "Padre amado, dejo en tus manos fuertes todas mis ansiedades y mis planes futuros. Enséñame a caminar a tu ritmo sereno, confiando en que tú sostienes mi mundo, no yo.",
            compromiso: "Me comprometo a soltar conscientemente el control de al menos una situación que hoy me cause estrés o frustración, rindiéndola en las manos de Dios."
        },
        {
            id: 3,
            title: "La paz que desafía la tormenta",
            subtitle: "Descubrir Su presencia silenciosa en el corazón de nuestras crisis.",
            icon: "moon",
            theme: "theme-3",
            bgImage: "https://images.unsplash.com/photo-1505144808419-1957a94cb612?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs3, cantosDB.le3],
            preparacion: "Cierra los ojos e imagina que es de noche profunda. Te encuentras en una pequeña frágil barca de madera en medio del mar oscuro. De repente, el viento empieza a soplar con furia incontenible. Las olas se levantan amenazantes y el agua helada comienza a inundar tu espacio vital. Siente el miedo físico, el ruido ensordecedor del caos a tu alrededor. Ahora, gira lentamente tu mirada hacia la popa: Jesús está allí. Está durmiendo plácidamente sobre un cojín. Su paz interior es tan colosal que la tormenta exterior no logra perturbarlo lo más mínimo. Él es el ancla inamovible en medio del caos.",
            peticion: "Señor, frente a las tempestades inesperadas de mi vida, otórgame una fe firme que no se fundamente en que todo salga bien, sino en descubrir tu presencia soberana incluso en tus más densos silencios.",
            cita: 'Lo despertaron y le dijeron: «Maestro, ¿no te importa que perezcamos?». Él se despertó, increpó al viento y dijo al mar: «¡Calla, enmudece!». El viento cesó y sobrevino una gran calma. (Marcos 4, 38-39)',
            saboreo: "No albergues temor de identificarte plenamente con el grito desesperado de los discípulos: '¿No te importa?'. Es la oración cruda y genuina del que sufre. En ocasiones, el silencio temporal de Dios nos parece indiferencia cruel, pero en realidad es la suprema confianza del que sabe que el barco, contigo dentro, jamás se hundirá. Contempla ahora cómo Jesús se levanta con majestuosidad. Su palabra tiene absoluta autoridad sobre el caos cósmico y sobre el caos turbulento de tu mente. Deja que su voz resuene en las ansiedades que te quitan el sueño, diciendo con firmeza y amor insondable: '¡Calla, enmudece!'.\n\nProfundiza aún más en esa figura de Jesús durmiendo. No es un sueño de evasión o desinterés, sino de dominio absoluto. Te invita a preguntarte con sinceridad frontal: ¿Quién gobierna realmente mi barca hoy? Si Él está verdaderamente a bordo, el agua de los problemas puede mojarte, puedes sentir frío e incertidumbre, pero ten la certeza absoluta de que no te ahogarás. Aprender a 'dormir' y descansar con Jesús en medio del nudo de la crisis es el acto supremo de fe madura. Es dejar de remar desesperadamente contra la corriente y permitir que Su soberanía dicte el momento exacto para que el viento enmudezca.",
            tituloPoema: "Salmo de las Madrugadas en Vela",
            oracionPoetica: "Maestro de las madrugadas en vela,\ncuando el agua me llegue al cuello\ny el ruido de mis miedos apague mi fe,\nno permitas que dude de tu presencia en mi barca.\n\nA veces la noche es demasiado oscura y las olas muy altas.\nSiento que te duermes, que mi naufragio no te importa,\ny el pánico me hace gritar a la deriva.\nPerdona mi fe frágil, mi miopía ante tu misterio.\n\nAunque parezcas dormir entre mis zozobras,\nenséñame a contagiarme de tu calma profunda,\ny pronuncia, sobre la tempestad de mis ansiedades,\ntu rotundo y definitivo: ¡Calla, enmudece!\n\nEnséñame a no medir tu amor por el clima de mis días,\na no buscarte solo en la brisa suave y el sol radiante.\nQue mi fe eche raíces profundas en medio de la tormenta,\nsabiendo que el timón reposa seguro en tus manos heridas.\n\nY si el agua llega a cubrirme y siento que me ahogo,\nsé tú el oxígeno puro que rescate mis pulmones agotados.\nHaz que mi corazón asustado lata al compás del tuyo,\nhasta que la tempestad ceda, vencida por tu paz eterna.",
            dialogo: [
                { id: 'd3_1', label: "Señor, la tormenta que en este preciso instante agita mi barca, la que me llena de agua e incertidumbre paralizante, es..." },
                { id: 'd3_2', label: "Aunque a veces mi angustia me haga sentir que duermes, hoy quiero pedirte que pronuncies tu poderoso '¡Calla, enmudece!' sobre..." }
            ],
            oracionFinal: "Jesús, Maestro de las tormentas, gracias por no abandonar jamás mi frágil barca. Que tu presencia silenciosa pero poderosa sea mi única ancla cuando el miedo intente ahogarme.",
            compromiso: "Me comprometo a hacer una pausa intencional de 2 minutos de silencio absoluto la próxima vez que sienta que el miedo o la ansiedad comienzan a agitar mi día."
        },
        {
            id: 4,
            title: "Quitarse las vendas",
            subtitle: "El coraje vulnerable de soltar nuestras falsas y antiguas seguridades.",
            icon: "sparkles",
            theme: "theme-4",
            bgImage: "https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs4, cantosDB.le4],
            preparacion: "Ponte en la piel asoleada de Bartimeo. Eres ciego, te encuentras sentado en el polvo, al borde del camino, tristemente acostumbrado a sobrevivir de las migajas y sobras de los demás. Has terminado por aceptar tu limitación como un destino inamovible. De pronto, un murmullo creciente agita el aire: Jesús de Nazaret está pasando. Movido por una esperanza irracional y fiera, empiezas a gritar. Los 'prudentes' te mandan callar, pero tú gritas aún más fuerte. Entonces, el universo entero parece detenerse de golpe. Alguien se acerca y te susurra: '¡Ánimo, levántate, te llama!'. Siente el salto desbocado de tu corazón en el pecho.",
            peticion: "Jesús, Médico divino de las almas, infúndeme la valentía de reconocer mi propia ceguera persistente —mis prejuicios, mis antiguos rencores, mi egoísmo sutil— y el deseo ardiente de dejarme sanar integralmente por Ti.",
            cita: 'El ciego, arrojando su manto, dio un salto y se acercó a Jesús. Jesús le preguntó: «¿Qué quieres que haga por ti?». El ciego le dijo: «Maestro, que recobre la vista». Jesús le dijo: «Vete, tu fe te ha salvado». (Marcos 10, 50-52)',
            saboreo: "Contempla con profunda atención la acción liberadora de 'arrojar el manto'. Para un mendigo de aquel tiempo, el manto lo era todo: su casa, su identidad pública, su única protección contra las gélidas noches del desierto. Bartimeo lo suelta radicalmente para ir ligero, sin estorbos, hacia la voz que lo llama. ¿Cuál es tu manto? ¿De qué mecanismos de defensa oxidados, excusas elaboradas, resentimientos guardados o 'zonas de confort' paralizantes tienes que despojarte hoy para sanar? Luego, maravíllate ante el absoluto y delicado respeto de Jesús. No le impone la cura desde arriba; se inclina y le pregunta: '¿Qué quieres que haga por ti?'. Dios, en su infinita cortesía, espera siempre tu permiso.\n\nReflexiona detenidamente sobre ese salto físico y espiritual de Bartimeo. No se levanta despacio, ni dudando, ni sopesando pros y contras; da un salto íntegro. Ese impulso nace de una confianza ciega, visceral, en Quien lo llama. A veces, nuestro proceso de sanación interior se retrasa indefinidamente porque soltamos nuestras 'vendas' a cuentagotas, guardando un trozo de excusa por si acaso nos arrepentimos. Dios te invita hoy a dar ese salto entero, a dejar en el polvo todo aquello que te impide ver tu propia luz y la belleza de los demás, confiando plenamente en que Su gracia sostendrá tu caída.",
            tituloPoema: "Salmo de los Caminos Polvorientos",
            oracionPoetica: "Jesús de los caminos polvorientos,\narráncame el manto de mis excusas perfectas,\nese con el que tapo mi mediocridad y mis miedos.\nDame el coraje de gritar tu nombre\ncuando la costumbre me mande callar.\n\nMe he acostumbrado tanto a mi oscuridad\nque a veces la prefiero al vértigo de tu luz.\nMe acomodo en los márgenes de mi propia historia,\npidiendo migajas cuando me ofreces un banquete.\n\nY si hoy te paras frente a mí y me preguntas qué quiero,\nque no pida consuelos baratos ni parches temporales.\nQue mi única respuesta, valiente y desnuda, sea:\n'Maestro, que pueda ver la vida con tus ojos'.\n\nQue no me asuste el resplandor de mi propia sanación,\nni me acobarde el desafío de caminar al fin sin muletas.\nDame la fuerza inmensa para sostenerle la mirada a mi nueva vida,\nsin añorar jamás la costumbre triste de mi rincón de siempre.\n\nQuiero aprender a mirar con las pupilas recién lavadas,\na descubrir los milagros cotidianos escondidos en las cosas pequeñas.\nY que cada paso que dé, ligero, confiado y sin cargas viejas,\nsea una danza de profunda gratitud hacia tu voz que me llamó.",
            dialogo: [
                { id: 'd4_1', label: "Señor, el manto pesado de excusas y falsas seguridades que hoy necesito arrojar decididamente para correr hacia Ti es..." },
                { id: 'd4_2', label: "Si te paras justo frente a mí en este instante y me preguntas qué quiero que hagas por mí, mi respuesta más honesta y urgente es..." }
            ],
            oracionFinal: "Señor que devuelves la vista, gracias por llamarme siempre a caminar en tu luz. Dame la audacia de seguir soltando mis zonas de comodidad para correr libremente hacia Ti.",
            compromiso: "Me comprometo a identificar hoy una excusa habitual que me paraliza o me impide amar mejor, y a 'arrojarla' lejos con un acto concreto de valentía."
        },
        {
            id: 5,
            title: "La savia que da alegría",
            subtitle: "Aprender a vivir desde el ser y no desde el hacer incesante.",
            icon: "leaf",
            theme: "theme-5",
            bgImage: "https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs5, cantosDB.le5],
            preparacion: "Imagina una viña espléndida despertando al rocío del amanecer. Observa los sarmientos (las ramas), repletos de hojas de un verde vibrante y uvas maduras y pesadas, profundamente unidos al tronco recio y antiguo. Es de ese tronco de donde reciben sin interrupción toda el agua, la vida y los nutrientes vitales (la savia). Piensa en ti mismo como uno de esos sarmientos. Mientras permanezcas injertado en el tronco, la vida fluirá a través de ti sin esfuerzo ansioso ni tensión. Pero si te cortan, por más lozano y verde que luzcas hoy, empezarás a secarte inevitablemente. Siente en tu interior esa necesidad vital, casi biológica, de conexión con la Fuente.",
            peticion: "Señor, concédeme la gracia de permanecer firmemente arraigado en Ti durante cada hora de este día, para que mis acciones no broten de una urgencia vacía, sino de la abundancia de Tu Espíritu, dando frutos de verdadera y perdurable alegría.",
            cita: '"Yo soy la vid, ustedes los sarmientos. El que permanece en mí, y yo en él, da mucho fruto... Les he dicho esto para que mi alegría esté en ustedes, y su alegría sea plena." (Juan 15, 5.11)',
            saboreo: "Detente sin prisa en el verbo 'Permanecer'. Es una acción aparentemente pasiva a los ojos del mundo, pero espiritualmente es profundamente transformadora. Permanecer no requiere correr frenéticamente, ni demostrar a cada instante lo bueno y capaz que eres, ni multiplicar interminablemente tus tareas; requiere pura y simplemente 'estar', dejarte amar pasivamente, dejarte nutrir en el silencio fecundo y la confianza total. ¿En qué momentos del día te desconectas sutilmente de la Fuente? A menudo actuamos impulsados desde la hiperactividad estresada, y terminamos secos, irritables, dolorosamente vacíos por dentro. Jesús te invita hoy a que tu obrar en el mundo sea, sencillamente, un desbordamiento natural de tu estar a solas con Él.\n\nConsidera, además, cómo esta savia divina viaja silenciosamente desde el tronco milenario hasta la hoja más lejana. No hace ruido, no exige atención, pero es maravillosamente constante. Así debería ser tu relación cotidiana con Dios. No necesitas provocar grandes momentos de estruendo espiritual o emociones desbordantes todos los días; necesitas cultivar esa conexión constante y humilde. Cada respiración profunda, cada breve segundo de silencio en medio del trabajo ruidoso, puede convertirse en un acto consciente de beber de esa savia. Permite que esa corriente de vida pura limpie tus motivaciones y renueve tus fuerzas cansadas desde adentro.",
            tituloPoema: "Salmo de las Horas Contadas",
            oracionPoetica: "Viñador de mis horas contadas,\nque no me pierda en la rama de la hiperactividad\nolvidando el tronco firme de tu amor.\nSálvame de la ilusión de creer que soy yo quien da la vida.\n\nCorro de un lado a otro inventando frutos,\nagotando mis reservas para demostrar que soy útil.\nY termino seco, frágil al viento, partido por dentro,\nlejos de la fuente que me vio nacer.\n\nEnséñame el misterio sereno de 'permanecer',\nde anclar mis raíces en el agua de tu gracia,\npara que todo lo que haga hoy no sea un esfuerzo estéril,\nsino un desbordamiento alegre de tu Espíritu en mí.\n\nLíbrame del orgullo ciego de querer florecer en el desierto\narrancándome voluntariamente de la tierra buena que me sostiene.\nQue entienda de una vez que mis hojas verdes no son mérito mío,\nsino el regalo gratuito de tu savia recorriendo mis venas.\n\nAyúdame a ser rama dócil que no resiste la poda experta,\nque acepta con paz los cortes necesarios para dar mejor fruto.\nY que al final de mi jornada, mi única preocupación y victoria\nsea comprobar con gratitud que sigo fuertemente unido a tu tronco.",
            dialogo: [
                { id: 'd5_1', label: "Señor, reconozco con dolor que me 'seco' por dentro cuando me desconecto de Ti y busco ansiosamente mi plenitud en..." },
                { id: 'd5_2', label: "Para permanecer unido a tu amor, fluyendo como savia vital en medio del fragor de mis rutinas, me propongo hoy..." }
            ],
            oracionFinal: "Espíritu de Vida, mantenme firmemente injertado en el amor de Cristo. Que todas las obras que emprenda hoy sean únicamente un desbordamiento feliz de tu savia en mí.",
            compromiso: "Me comprometo a dedicar 5 minutos en medio de mis rutinas simplemente para 'estar' con Él, respirando, sin pedir ni intentar producir nada, solo descansando en su presencia."
        },
        {
            id: 6,
            title: "El lavatorio diario",
            subtitle: "El hermoso escándalo de la gracia que se abaja para servir.",
            icon: "droplets",
            theme: "theme-6",
            bgImage: "https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs6, cantosDB.le6],
            preparacion: "Entra mentalmente y en silencio en la penumbra cálida e íntima de la sala de la Última Cena. Observa a Jesús. Sabiendo perfectamente que viene de Dios y vuelve a Dios, no exige tronos ni reconocimientos. Se levanta de la mesa en un silencio sagrado que sobrecoge, se quita el manto de maestro y se ciñe a la cintura una toalla rústica de siervo. Empieza a lavar los pies sucios, llagados y polvorientos de sus amigos más cercanos. Un trabajo reservado entonces exclusivamente para los esclavos de menor rango. Imagina que, lentamente, llega a tu lugar. Dios encarnado se arrodilla en el suelo de tierra, justo frente a ti, toma tus pies cansados en sus manos santas y los lava con una delicadeza y un amor infinitos.",
            peticion: "Señor, rompe las corazas de mi orgullo. Dame un corazón dócil y humilde para dejarme purificar por tu gracia inmerecida, y ojos nuevos para descubrir siempre tu rostro en la dignidad sagrada de mis hermanos.",
            cita: '"Pues si yo, el Señor y el Maestro, les he lavado los pies, también ustedes deben lavarse los pies unos a otros. Porque les he dado ejemplo, para que como yo he hecho con ustedes, también ustedes lo hagan." (Juan 13, 14-15)',
            saboreo: "Saborea con estupor la humildad escandalosa e insospechada de Dios. A veces resulta mucho más difícil dejarse servir íntimamente por Dios que afanarse en servirlo a Él; nos cuesta horrores aceptar que nos ame plenamente en nuestra suciedad, en nuestra imperfección crónica (como le ocurrió a Pedro). Pero una vez que te dejas limpiar y amar así, Él te levanta y te envía. En tu cruda realidad cotidiana, 'lavar los pies' hoy puede no ser un acto litúrgico grandioso, sino escuchar con paciencia heroica a quien te irrita profundamente, tragarte a tiempo una respuesta sarcástica, perdonar en silencio un desprecio menor, o realizar un trabajo invisible y monótono por puro amor a tu familia.\n\nEste acto de lavar los pies rompe drásticamente con todas nuestras categorías mundanas de jerarquía, éxito y poder. Jesús invierte por completo el orden del universo en la penumbra de esa sala. Pregúntate con honestidad si en tus relaciones diarias buscas inconscientemente el lugar principal, el ser servido, el llevar siempre la razón. El agua tibia de esa jofaina tiene el poder sagrado de disolver también esas vanas pretensiones. Cuando realmente dejas que Él te lave, descubres maravillado que la verdadera grandeza de un ser humano se encuentra en su capacidad de abajarse, de hacerse tierra humilde para que el otro camine suave.",
            tituloPoema: "Salmo de la Toalla Ceñida",
            oracionPoetica: "Señor de la toalla ceñida a la cintura,\nsálvame de mi propia arrogancia disfrazada de servicio.\nQuiebra mi resistencia a dejarme amar en mi suciedad,\ny arrodíllate en los rincones oscuros de mi alma.\n\nQué difícil es dejar que me veas sin adornos,\nque toques mis pies cansados, manchados de egoísmo.\nPrefiero el pedestal de mi orgullo intacto\na la vulnerabilidad de sentir tu ternura lavando mis heridas.\n\nY luego, cuando me hayas limpiado con tu gracia,\nquítame los delirios de grandeza, dame ojos limpios,\npara que no me cueste agacharme a lavar\nlos pies cansados de quienes cruzan mi camino hoy.\n\nRompe de una vez mis esquemas de poder y mis falsas jerarquías,\ndonde creo que valgo por los que me sirven y no por los que sirvo.\nEnséñame el lenguaje mudo pero elocuente del agua y la toalla,\nla revolución tranquila de un amor que sabe arrodillarse sin sonrojarse.\n\nQue no me duelan las rodillas al bajar a la altura del hermano que sufre,\nni se me caigan los títulos por abrazar de lleno su pobreza.\nQue tu ejemplo vivo se grabe a fuego lento en mi memoria,\ny haga de mi existencia entera un humilde lavatorio continuo.",
            dialogo: [
                { id: 'd6_1', label: "Jesús, me conmueve hasta las lágrimas y a la vez me resiste verte de rodillas ante mí. El 'polvo' de mis actitudes del que hoy más necesito que me laves con tu perdón es..." },
                { id: 'd6_2', label: "Al mirar atentamente a mi alrededor, siento que hoy me invitas a 'lavarle los pies' (servir con paciencia silenciosa y humildad verdadera) a..." }
            ],
            oracionFinal: "Señor humilde y paciente, lávame primero de mi propio egoísmo y orgullo. Lléname de tu gracia para que, amado por ti, pueda abajarme a servir a mis hermanos con profunda alegría.",
            compromiso: "Me comprometo a realizar hoy un acto concreto de servicio oculto y silencioso por alguien de mi entorno, sin esperar que me lo agradezcan ni lo noten."
        },
        {
            id: 7,
            title: "Sal y Luz",
            subtitle: "El sutil arte de irradiar la Presencia sin estridencias.",
            icon: "sun",
            theme: "theme-7",
            bgImage: "https://images.unsplash.com/photo-1495555961416-6ed8d068d374?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs7, cantosDB.le7],
            preparacion: "Imagina una habitación inmensa sumida en una oscuridad total y asfixiante. Siente por un momento la incomodidad palpable de no ver absolutamente nada, la desorientación angustiosa. De pronto, alguien en la lejanía enciende un pequeño fósforo y prende una vela minúscula. Inmediatamente, la tiranía de la oscuridad es derrotada. No desaparece por completo, pero ya no domina el espacio. La luz no hace ruido al nacer, no exige atención de manera altanera, simplemente se da, se consume silenciosamente para iluminar a otros. Tú eres esa pequeña vela, encendida por el mismo Dios a través de este rato de intimidad y oración.",
            peticion: "Señor de la Luz, te ruego que no esconda la fe ni el amor que me has regalado por miedo al rechazo o vergüenza. Que mi forma de vivir el día a día, mucho más que mis discursos elocuentas, sea un testimonio vivo y palpitante de tu compasión.",
            cita: '"Ustedes son la luz del mundo. No se enciende una lámpara para meterla debajo de un cajón, sino para ponerla en el candelero... Brille así su luz delante de los hombres, para que vean sus buenas obras y den gloria a su Padre." (Mateo 5, 14-16)',
            saboreo: "Ser luz en medio del mundo no significa ser moralmente perfecto ni andar dando lecciones de superioridad a los demás. La verdadera luz, la que nace del Espíritu, da calidez al que tiene frío, orienta con suavidad en la confusión ajena, y resalta la belleza oculta de lo que ilumina. De manera similar, la sal otorga sabor indispensable a la comida sin hacerse notar, disolviéndose humilde y anónimamente en el alimento. ¿Estás acaso escondiendo tu luz bajo el asfixiante 'cajón' de la rutina gris, de la queja constante, o del miedo paralizante al qué dirán? Tu hogar, tu trabajo y tus amigos necesitan urgentemente el 'sabor' único de tu esperanza.\n\nObserva también cómo la sal no solo da sabor al plato, sino que en la antigüedad se utilizaba principalmente para preservar los alimentos de la corrupción. Tu presencia viva, por modesta y pequeña que te parezca, tiene la enorme capacidad de evitar que el desánimo, el cinismo cortante o la desesperanza pudran tu entorno más cercano. No necesitas deslumbrar a las multitudes ni hacer discursos magistrales. A veces, ser luz verdadera es simplemente no sumarse a la queja generalizada, ofrecer una sonrisa sincera cuando todos están tensos, o detenerte a escuchar cuando nadie parece tener tiempo. Ese es el sabor revolucionario y transformador del Evangelio vivo.",
            tituloPoema: "Salmo de los Luceros Domésticos",
            oracionPoetica: "Encendedor de luceros domésticos,\nque no necesite deslumbrar con grandes discursos,\nsino apenas iluminar el metro cuadrado que piso.\nHazme sal que se disuelve en silencio\npara devolverle el sabor a la rutina de los míos.\n\nA veces me quejo de la oscuridad del mundo,\ny me olvido de encender la vela que pusiste en mis manos.\nA veces me escondo bajo el cajón del qué dirán,\ntemiendo que mi pequeña luz sea juzgada o apagada.\n\nQuítame el complejo de esconder tu luz,\nenséñame a gastarme sin hacer ruido, iluminando rincones.\nY que quien se cruce conmigo hoy, sin saber muy bien por qué,\nsienta que acaba de salir el sol en su invierno.\n\nSálvame de la sutil vanidad de querer ser un faro imponente\ncuando solo me pides ser una humilde llama en la ventana.\nQue mi fuego no queme a nadie ni deslumbre con orgullo farisaico,\nsino que caliente tiernamente las manos del que tiembla de frío.\n\nY si el viento rudo y cambiante del mundo amenaza con apagarme,\nsé tú el cuenco protector que resguarde mi pequeña chispa parpadeante.\nPara que arda calladamente hasta consumirme por completo,\nfeliz y en paz de haber dado mi vida entera para alumbrar a mi prójimo.",
            dialogo: [
                { id: 'd7_1', label: "Señor, revisando con gratitud mis dones, creo que la luz particular (quizá la alegría, la escucha atenta, la capacidad de pacificar) que has puesto en mi interior es..." },
                { id: 'd7_2', label: "Al volver hoy a mis tareas habituales, me comprometo a dejar de esconderme en las sombras y ser luz mediante este pequeño, pero concreto y valiente gesto:" }
            ],
            oracionFinal: "Cristo, Luz inagotable del mundo, haz que tu suave claridad brille incluso a través de mis grietas e imperfecciones. Que mi simple presencia hoy lleve esperanza y dé un buen sabor a mi entorno.",
            compromiso: "Me comprometo a tener una actitud sumamente propositiva y a llevar una palabra sincera y gratuita de aliento a alguien que note cansado, desanimado o poco valorado hoy."
        },
        {
            id: 8,
            title: "El desierto que purifica",
            subtitle: "Afrontar el silencio absoluto para escuchar lo verdaderamente esencial.",
            icon: "compass",
            theme: "theme-8",
            bgImage: "https://images.unsplash.com/photo-1509316785289-025f5b846b35?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs8, cantosDB.le8],
            preparacion: "Visualiza un vasto e inabarcable desierto de arena bajo un cielo inmenso y límpido. El silencio allí es abrumador, posee una densidad casi física. No hay pantallas brillando, no hay notificaciones zumbando, no hay voces ajenas ni distracciones urgentes reclamando tu atención. Solo estás tú y tu verdad más desnuda ante el horizonte. En el centro de ese desierto, Dios te espera con paciencia infinita. Al principio, la falta de ruido te incomoda profundamente, te enfrenta de golpe a tus propios vacíos no resueltos. Quédate ahí. No huyas. Respira. Permite que la incomodidad inicial ceda lentamente el paso a una Presencia amorosa y majestuosa que llena todo ese espacio vacío.",
            peticion: "Señor, libérame definitivamente del miedo atroz a la soledad y al silencio. Dame la valentía de adentrarme en mis propios desiertos interiores para que allí purifiques mi corazón y pueda, al fin, escuchar tu voz sin interferencias.",
            cita: '"Por eso, yo voy a seducirla; la llevaré al desierto y le hablaré al corazón... Allí me responderá como en los días de su juventud." (Oseas 2, 16-17)',
            saboreo: "Solemos huir despavoridos del desierto llenando nuestra vida de ruido incesante, adicciones menores, consumismo o hiperconexión digital, fundamentalmente porque el silencio nos obliga a mirar de frente nuestras heridas abiertas. Sin embargo, Dios revela algo de una belleza estremecedora a través del profeta: no te lleva al desierto para castigarte por tus faltas o abandonarte a tu suerte, sino para 'seducirte' y 'hablarte al corazón'. Es únicamente en la desnudez de tu ser, despojado de todas tus máscaras sociales, donde Dios puede declararte su amor más íntimo y restaurar la frescura de tu vocación original.\n\nDate cuenta de cómo el desierto impone su propia e implacable geografía a tu alma. Al principio, tus ojos, acostumbrados al neón de la ciudad, ven solo arena estéril y desolación. Pero a medida que aprendes a mirar, empiezas a notar una vida sutil, resistente y hermosa que logra sobrevivir allí. Así de paradójica es tu vida interior. Lo que en un primer momento considerabas árido, cuando es visitado prolongadamente por el silencio y por Dios, revela fortalezas ocultas y pozos de agua fresca que no sabías que tenías. No apresures ansiosamente la salida de este desierto; permite que su crudeza te despoje de lo superfluo hasta que solo quede en ti el puro anhelo de Dios.",
            tituloPoema: "Salmo de los Silencios Habitados",
            oracionPoetica: "Dios de los silencios habitados,\nllévame allí donde no hay cobertura celular,\ndonde las notificaciones mueren\ny solo queda el latido desnudo de mi alma.\n\nLe tengo pánico al vacío y huyo hacia el ruido.\nMe aturdo con mil voces para no escuchar la mía,\npara no enfrentarme a los fantasmas de mis miedos\nque me esperan agazapados en la quietud de la tarde.\n\nSedúceme en la aridez de mis desiertos cotidianos,\nrompe mi adicción al ruido que me anestesia.\nAtrévete a desarmarme en la arena de mi verdad,\ny háblame al corazón tan bajo, tan suave,\nque tenga que detener todo mi mundo para escucharte.\n\nHazme amigo de la intemperie y de los cielos abiertos,\ndonde no hay techos que escondan la inmensidad de tu mirada.\nQue la arena queme las plantas de mis pies acostumbrados\na los caminos fáciles y a las respuestas espirituales prefabricadas.\n\nY cuando el silencio absoluto pese tanto que duela en el pecho,\nno me dejes retroceder a la ciudad bulliciosa de las distracciones.\nSosténme ahí, vulnerable, honesto y desnudo ante tu presencia,\nhasta que tu voz compasiva sea lo único que necesite escuchar.",
            dialogo: [
                { id: 'd8_1', label: "Señor, reconozco con honestidad que el 'ruido' (pantallas, activismo frenético, quejas) con el que más suelo tapar mis silencios incómodos o miedos profundos es..." },
                { id: 'd8_2', label: "Si dejo de huir ahora mismo y permito que me hables en la quietud de este desierto interior, creo que lo que quieres susurrarme hoy con infinito amor es..." }
            ],
            oracionFinal: "Dios inmenso de los silencios, gracias por buscarme tenazmente cuando huyo hacia el ruido. Ayúdame a no temerle a mi propia quietud y a hacer de mi interior una morada digna de tu paz.",
            compromiso: "Me comprometo a desconectarme totalmente de pantallas y dispositivos al menos 30 minutos antes de dormir, regalando ese tiempo final del día a la pausa y al examen agradecido."
        },
        {
            id: 9,
            title: "El pozo de agua viva",
            subtitle: "Descubrir y nombrar la sed más honda y antigua de nuestra alma.",
            icon: "droplet",
            theme: "theme-9",
            bgImage: "https://images.unsplash.com/photo-1445384763658-0400939829cd?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs9, cantosDB.le9],
            preparacion: "Es pleno mediodía, el sol cae a plomo, vertical, y el calor es abrasador y sofocante. Eres la mujer samaritana. Llegas arrastrando los pies, cansada, al milenario pozo de Jacob con tu pesado cántaro vacío a cuestas. Llevas contigo una sed antigua, un vacío y una insatisfacción crónica que ninguna relación, ningún logro y ninguna distracción ha podido saciar jamás. Allí, sentado al borde del brocal de piedra, te espera Jesús. Él conoce de sobra toda tu intrincada historia, conoce tus fracasos repetidos y los 'pozos' equivocados donde has buscado mendigar amor. Y, sin embargo, no hay ni un atisbo de condena en sus ojos. Te mira con una complicidad salvadora, pidiéndote de beber, haciéndose el necesitado para iniciar el encuentro que cambiará tu vida.",
            peticion: "Señor Jesús, ayúdame a ser radicalmente honesto/a con mis anhelos más profundos. Dame a beber incesantemente de tu Espíritu, esa agua viva que brota desde el interior y otorga el verdadero y definitivo sentido a mi existencia.",
            cita: 'Jesús le respondió: «Todo el que beba de esta agua, volverá a tener sed; pero el que beba del agua que yo le daré, nunca más tendrá sed. El agua que yo le daré se convertirá en él en manantial que brota para vida eterna». (Juan 4, 13-14)',
            saboreo: "Todos somos, en el fondo, portadores de cántaros agujereados. Examina con valentía las aguas de las que sueles beber a diario: la aprobación social pasajera, el éxito profesional efímero, la acumulación de posesiones, las relaciones de dependencia afectiva. Todo eso es agua buena y lícita en su medida, pero ineludiblemente te dejará con sed de nuevo al atardecer. Cristo apunta a una sed infinitamente más profunda: la sed ontológica de eternidad y de amor absoluto. Él no reprende tu sed, la comprende; sabe que estás buscando desesperadamente el Infinito en realidades finitas. Te ofrece el don supremo: convertirse Él mismo en un manantial vivo e inagotable dentro de ti, para que tu paz profunda ya no dependa jamás de las circunstancias externas.\n\nPiensa detenidamente en ese 'cántaro' material que llevas contigo a todas partes. A menudo está hecho de nuestras viejas ambiciones, nuestros apegos tercos, y nuestra insaciable necesidad de seguridad material o control. Fíjate que Jesús no te quita el cántaro a la fuerza; su método es distinto. Te ofrece un agua tan pura y desbordante que tú mismo, por voluntad propia y alegre, decides soltarlo, al igual que la samaritana que lo dejó olvidado junto al pozo para ir a anunciar la noticia. Ese olvido del cántaro es el signo más claro de la verdadera liberación interior. Ya no necesitas cargar el peso agotador de intentar saciarte a ti mismo, porque ahora llevas el manantial adentro.",
            tituloPoema: "Salmo de la Sed y el Cántaro",
            oracionPoetica: "Agua viva para mi sed de viernes por la tarde,\nlíbrame de los charcos donde mendigo cariño\ny de los cántaros rotos donde intento retener el éxito.\nTú conoces mi historial de búsquedas fallidas,\nmi historial de pozos que me dejaron vacío.\n\nHe caminado bajo el sol abrasador de mis caprichos,\nbuscando saciar esta sed eterna con amores a medias,\ncon espejismos de triunfo que se evaporan al tocarlos.\nHe regresado siempre al pozo con el cántaro más seco.\n\nHoy me siento al borde del brocal frente a ti,\ncansado de buscar fuera lo que solo Tú puedes darme.\nYa no tengo excusas que darte, ni fuerzas para huir.\nRompe mi cántaro viejo, Señor, y dame de beber de tu centro.\n\nDespiértame del letargo de conformarme con tan poco,\nde aplacar mi sed infinita con sorbos amargos de vanagloria.\nQuiero beber hoy del torrente de tus delicias eternas,\ndel agua limpia que lava la culpa y restaura la vida nueva.\n\nY cuando me haya saciado por fin descansando en tu pecho abierto,\nhaz que mi propio corazón humano se vuelva un manantial vivo.\nPara que otros que vagan sedientos por los mismos desiertos que yo,\nencuentren en mi sonrisa un reflejo claro de tu agua salvadora.",
            dialogo: [
                { id: 'd9_1', label: "Jesús, con total transparencia, los pozos engañosos donde suelo ir a buscar saciar mi sed de significado (y que al final me dejan más vacío/a y exhausto/a) son..." },
                { id: 'd9_2', label: "Señor, dame incesantemente de esa agua. Al asomarme al fondo de mi corazón en este instante, reconozco que mi sed más profunda, real y dolorosa hoy es de..." }
            ],
            oracionFinal: "Fuente eterna de Agua Viva, te pido que sacies mi sed más honda con tu presencia inagotable. Concédeme la sabiduría para no buscar más en pozos secos lo que solo Tú puedes darme.",
            compromiso: "Me comprometo a detener al menos un impulso inútil de consumo o distracción en este día, recordando firmemente que mi verdadero vacío solo se llena con tu Amor."
        },
        {
            id: 10,
            title: "El camino de Emaús",
            subtitle: "La asombrosa liturgia de lo cotidiano y el corazón que arde de nuevo.",
            icon: "flame",
            theme: "theme-10",
            bgImage: "https://images.unsplash.com/photo-1476820865390-c52aeebb9891?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs10, cantosDB.le10],
            preparacion: "Caminas pesadamente por un sendero polvoriento mientras el sol empieza a ocultarse tiñendo el cielo de tonos melancólicos. Te alejas de Jerusalén, el lugar de tus esperanzas frustradas. Vas inmensamente triste, decepcionado/a de la vida y quizá de Dios, dándole vueltas obsesivamente a tus ilusiones rotas y a las oraciones que parecen no haber sido escuchadas en absoluto. De pronto, un forastero se empareja suavemente contigo. Ajusta su ritmo a tu paso cansado. Te hace preguntas abiertas y te escucha con una atención absoluta y reverencial. Siente el inmenso, reparador alivio de poder volcar toda tu queja amarga y tu dolor contenido en alguien que no te interrumpe, no te juzga ni minimiza en lo más mínimo tu sufrimiento.",
            peticion: "Señor Resucitado, abre de par en par los ojos aletargados de mi fe. Ayúdame a reconocerte caminando a mi lado, a menudo de incógnito, especialmente en mis momentos de mayor frustración, oscuridad y desesperanza.",
            cita: 'Mientras conversaban y discutían, Jesús en persona se acercó y se puso a caminar con ellos. Pero sus ojos estaban velados... Y se dijeron uno a otro: «¿No ardía nuestro corazón mientras nos hablaba por el camino y nos explicaba las Escrituras?». (Lucas 24, 15-16.32)',
            saboreo: "A veces Dios camina a nuestro lado disfrazado de una cotidianidad tan extrema que nos pasa desapercibido: en la palabra dicha a tiempo de un viejo amigo, en una coincidencia aparentemente fortuita, en la belleza repentina de un atardecer, o en una lectura que de pronto nos estremece el alma. Pero cuando estamos completamente enredados en nuestra espiral de tristeza ('nosotros esperábamos que Él fuera el que iba a liberar...'), nuestros ojos están densamente velados por el desencanto. Sin embargo, hay una pista inconfundible del paso sigiloso de Dios por tu historia: 'el corazón que arde'. Presta suma atención a esos momentos sutiles de consuelo profundo, de paz súbita, de luz interna que irrumpe sin explicación. Es Él, el Resucitado, insuflando vida y resucitando tu esperanza muerta.\n\nFíjate con atención en un detalle maravilloso: Jesús no los regaña por su huida inicial ni les reprocha su falta de fe. En cambio, se suma a su éxodo, caminando pacientemente en la misma dirección equivocada que ellos llevan, para poder girarlos desde adentro hacia la vida. Dios tiene esa pedagogía sublime y desconcertante: asume nuestra realidad por más perdida y frustrante que parezca. En tus propios escapes, en tus alejamientos voluntarios y en tus amargas decepciones, no estás caminando solo en ningún momento. Ese calor inexplicable en el pecho es el síntoma bendito de que la Verdad está desmantelando la mentira de tu soledad. Deja que el forastero te alcance.",
            tituloPoema: "Salmo de los Atardeceres Tristes",
            oracionPoetica: "Peregrino de los atardeceres tristes,\nempareja tu paso con mi caminar cansado\ncuando huyo de mis propias Jerusalenes en ruinas.\nEscucha mi queja amarga sin juzgarme,\ny calienta el café frío de mis desilusiones.\n\nVoy rumiando fracasos, cegado por la tristeza de lo que no fue.\nCuántas veces caminas a mi lado y mis ojos torpes no te ven.\nCuántas veces te disfrazas de brisa, de amigo, de silencio,\ny yo sigo atrapado en el laberinto de mis expectativas rotas.\n\nQuédate conmigo, Señor, que atardece y arrecia el frío.\nAbre mis ojos en la fracción del pan de cada día,\nexplícame mis propios dolores a la luz de tu misterio,\ny haz que mi corazón vuelva a arder de pura vida.\n\nCamina a mi lado aunque mi rumbo parezca estar equivocado,\npues sé que tu amor es experto en rediseñar los mapas perdidos.\nQue tu voz pacífica desarme por fin mis defensas de hierro,\ny tus preguntas sanadoras iluminen mis oscuras zonas ciegas.\n\nY al llegar exhausto a la posada al final de mi jornada gris,\nsiéntate a mi mesa, bendice mi pobreza y mis mendrugos.\nQue en el gesto cotidiano y sencillo de compartir contigo la vida,\nse me abran los ojos del alma y te descubra Señor de mi historia.",
            dialogo: [
                { id: 'd10_1', label: "Señor, al revisar con calma los últimos meses de mi vida, me doy cuenta asombrado/a de que pasaste por ahí y mi corazón 'ardió' de esperanza cuando..." },
                { id: 'd10_2', label: "Te ruego encarecidamente que te quedes conmigo, porque se hace de noche en algunas áreas de mi vida. Necesito imperiosamente reconocer tu presencia escondida y amorosa en..." }
            ],
            oracionFinal: "Compañero paciente de todos mis caminos, gracias por hacer arder mi corazón cuando todo parece oscuro a mi alrededor. Abre siempre mis ojos para reconocerte en cada pequeña fracción del pan cotidiano.",
            compromiso: "Me comprometo a escuchar hoy a alguien de mi entorno con la misma atención plena, paciencia, y absoluta falta de prejuicios con la que Jesús escuchó a los discípulos de Emaús."
        },
        {
            id: 11,
            title: "El abrazo del Padre",
            subtitle: "El milagro del perdón absoluto y el regreso a casa.",
            icon: "home",
            theme: "theme-11",
            bgImage: "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80",
            cantos: [cantosDB.hs11, cantosDB.le11],
            preparacion: "Imagina que caminas arrastrando los pies por un camino de tierra. Vienes de un 'país lejano', un lugar de decisiones equivocadas, de tiempo perdido y vacíos que intentaste llenar con cosas que no te saciaron. Hueles a fracaso, tu ropa está rota y tu dignidad herida. Ensayas mentalmente discursos de disculpa, creyendo que tendrás que ganarte de nuevo el amor. A lo lejos, divisas tu casa. Y de pronto, ves una figura mayor que sale corriendo hacia ti. Es tu Padre. Contra toda costumbre, perdiendo la compostura y la dignidad, corre desesperado a tu encuentro. No te deja terminar tu discurso de culpa; te envuelve en un abrazo asfixiante de puro amor, besando tu rostro sucio, celebrando simplemente que estás vivo.",
            peticion: "Padre de Misericordia, derriba mis muros de orgullo y de culpa. Dame la humildad profunda para dejarme perdonar sin intentar pagar por mi rescate, y la gracia de aceptar que tu amor es gratuito.",
            cita: '"Cuando todavía estaba lejos, su padre lo vio y se conmovió profundamente; corrió a su encuentro, lo abrazó y lo besó." (Lucas 15, 20)',
            saboreo: "Nuestro mayor obstáculo espiritual rara vez es la magnitud de nuestros pecados, sino nuestra resistencia a dejarnos perdonar. Queremos ser los 'héroes' de nuestra propia redención, queremos pagar nuestras deudas morales para no sentirnos vulnerables. Pero en la parábola del Hijo Pródigo, el Padre anula esa lógica mercantil. Él no ama al hijo porque el hijo sea bueno, lo ama porque es suyo. Siente el impacto escandaloso de ese abrazo: Dios no te pide explicaciones exhaustivas antes de restaurarte, no te pone un periodo de prueba. Su compasión (que en el griego original significa que 'se le conmovieron las entrañas') es inmediata. Suelta la culpa que cargas como un trofeo invertido y déjate abrazar.\n\nEl abrazo del Padre no se limita a perdonar una ofensa; su poder radica en que restituye por completo tu identidad perdida. El anillo en el dedo, las sandalias en los pies, el traje nuevo... todos son símbolos vibrantes de que no regresas a casa como un esclavo tolerado, sino como un hijo de pleno derecho. El mundo exterior te enseña implacablemente que los errores se pagan caro y dejan una mancha imborrable. Sin embargo, la misericordia divina te revela que su amor es capaz de hacer nuevas todas las cosas, restaurando una pureza original en tu alma que ningún fracaso temporal puede llegar a destruir. Créete verdaderamente esta restauración asombrosa hoy.",
            tituloPoema: "Salmo del Regreso a Casa",

        const isLarge = size === "large";
        const sizeClass = isLarge ? "icon-3d-large" : "icon-3d-normal";
        const iconSize = isLarge ? "40" : "28";
        return `
            <div class="icon-3d-wrapper ${themeClass} shadow-theme ${sizeClass}">

                    <i data-lucide="${iconName}" width="${iconSize}" height="${iconSize}" class="icon-shadow" style="color: white;"></i>
                </div>
            </div>
        `;
    }

    function handleInputChange(id, value) {
        journalData[`${activeDayId}_${id}`] = value;
    }

    function updateBackground() {
        const bgImg = document.getElementById('bg-image');
        const gradientOverlay = document.getElementById('gradient-overlay');
        
        if (activeDayId) {
            const day = DAYS.find(d => d.id === activeDayId);
            bgImg.style.opacity = 0;
            if (gradientOverlay) gradientOverlay.style.opacity = 0;
            
            setTimeout(() => {
                bgImg.src = day.bgImage;
                bgImg.classList.remove('mix-blend-overlay');
                bgImg.style.opacity = 1;
            }, 500);
        } else {
            bgImg.style.opacity = 0;
            if (gradientOverlay) gradientOverlay.style.opacity = 1;
            
            setTimeout(() => {
                bgImg.src = DEFAULT_BG;
                bgImg.classList.add('mix-blend-overlay');
                bgImg.style.opacity = 0.3;
            }, 500);
        }
    }

    function selectDay(id) {
        activeDayId = id;
        currentStep = 0;
        currentView = 'day';
        updateBackground();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
    }

    function goHome() {
        currentView = 'home';
        activeDayId = null;
        clearInterval(breathInterval);
        journalData = {};
        updateBackground();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
    }

    function nextStep() {
        if (currentStep < 7) { 
            currentStep++;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        } else {
            goHome();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }
    }

    function entregarOracion() {
        const dialogoContainer = document.getElementById('dialogo-content');
        dialogoContainer.classList.add('offer-animation');
        journalData[`${activeDayId}_entregado`] = true;

        setTimeout(() => {
            dialogoContainer.style.display = 'none';
            const msg = document.getElementById('entregado-msg');
            msg.classList.remove('hidden');
            msg.classList.remove('opacity-0');
            msg.classList.add('fade-in');
            lucide.createIcons();
        }, 2000);
    }

    function initBreathingAnimation() {
        clearInterval(breathInterval);
        if (currentView === 'day' && currentStep === 0) {
            isInhaling = true;
            const updateBreathingUI = () => {
                const container = document.getElementById('breath-container');
                const text = document.getElementById('breath-text');
                if(container && text) {
                    if (isInhaling) {
                        container.classList.remove('breath-exhale');
                        container.classList.add('breath-inhale');
                        text.innerText = 'INHALA';
                    } else {
                        container.classList.remove('breath-inhale');
                        container.classList.add('breath-exhale');
                        text.innerText = 'EXHALA';
                    }
                    isInhaling = !isInhaling;
                }
            };
            setTimeout(updateBreathingUI, 100);
            breathInterval = setInterval(updateBreathingUI, 4000);
        }
    }
