    <style>
        /* Animaciones personalizadas */
        body { margin: 0; padding: 0; overflow-x: hidden; }
        
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .slide-up { animation: slideUp 0.8s ease-out forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animación del Ritual de Entregar a Dios */
        .offer-animation {
            animation: offerUp 2s ease-in-out forwards;
        }
        @keyframes offerUp {
            0% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
            40% { transform: translateY(-15px) scale(1.02); opacity: 0.7; filter: blur(2px); color: #eab308; }
            100% { transform: translateY(-50px) scale(0.95); opacity: 0; filter: blur(12px); color: #fef08a; }
        }

        /* Clases para la respiración (Paso 1) */
        .breath-inhale .ring-1 { transform: scale(1.1); opacity: 0.4; }
        .breath-exhale .ring-1 { transform: scale(0.5); opacity: 0.1; }
        
        .breath-inhale .ring-2 { transform: scale(1); }
        .breath-exhale .ring-2 { transform: scale(0.75); }
        
        .breath-inhale .ring-3 { transform: scale(1); opacity: 1; }
        .breath-exhale .ring-3 { transform: scale(0.5); opacity: 0; }
        
        .breath-inhale .center-circle { transform: scale(1.05); }
        .breath-exhale .center-circle { transform: scale(0.95); opacity: 0.7; }
        
        .transition-all-slow { transition: all 4000ms ease-in-out; }
        
        /* Fondo colorido animado para el inicio */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .color-bg-home {
            background: linear-gradient(-45deg, #ff7e5f, #feb47b, #86a8e7, #91eae4, #c2e9fb, #a1c4fd);
            background-size: 400% 400%;
            animation: gradientBG 25s ease infinite;
        }

        /* Scrollbar suave */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
    </style>
</head>

        journalData[`${activeDayId}_${id}`] = value;

    }

    function updateBackground() {
        const bgImg = document.getElementById('bg-image');
        const gradientOverlay = document.getElementById('gradient-overlay');
        
        if (activeDayId) {
            const day = DAYS.find(d => d.id === activeDayId);
            bgImg.style.opacity = 0;
            if (gradientOverlay) gradientOverlay.style.opacity = 0;
            
            setTimeout(() => {
                bgImg.src = day.bgImage;
                bgImg.classList.remove('mix-blend-overlay');
                bgImg.style.opacity = 1;
            }, 300);
        } else {
            bgImg.style.opacity = 0;
            if (gradientOverlay) gradientOverlay.style.opacity = 1;
            
            setTimeout(() => {
                bgImg.src = DEFAULT_BG;
                bgImg.classList.add('mix-blend-overlay');
                bgImg.style.opacity = 0.3;
            }, 300);
        }
    }

    function selectDay(id) {
        activeDayId = id;
        currentStep = 0;
        currentView = 'day';
        updateBackground();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
    }

    function goHome() {
        currentView = 'home';
        activeDayId = null;
        clearInterval(breathInterval);
        
        // Limpiamos las respuestas al volver al inicio para permitir reingresos limpios
        journalData = {};
        
        updateBackground();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
    }

    function nextStep() {
        if (currentStep < 5) {
            currentStep++;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        } else {
            goHome();
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }
    }

        dialogoContainer.classList.add('offer-animation');
        
        // Registrar que se ha entregado
        journalData[`${activeDayId}_entregado`] = true;
        saveData();

        // Mostrar el mensaje de paz después de la animación
        setTimeout(() => {
            dialogoContainer.style.display = 'none';
            const msg = document.getElementById('entregado-msg');
            msg.classList.remove('hidden');
            msg.classList.remove('opacity-0');
            msg.classList.add('fade-in');

            lucide.createIcons();
        }, 1500); // Sincronizado con la animación CSS
    }

    function initBreathingAnimation() {
        clearInterval(breathInterval);
        if (currentView === 'day' && currentStep === 0) {
            isInhaling = true;
            const updateBreathingUI = () => {
                const container = document.getElementById('breath-container');
                const text = document.getElementById('breath-text');
                if(container && text) {
                    if (isInhaling) {
                        container.classList.remove('breath-exhale');
                        container.classList.add('breath-inhale');
                        text.innerText = 'INHALA';
                    } else {
                        container.classList.remove('breath-inhale');
                        container.classList.add('breath-exhale');
                        text.innerText = 'EXHALA';
                    }
                    isInhaling = !isInhaling;
                }
            };
            setTimeout(updateBreathingUI, 100);
            breathInterval = setInterval(updateBreathingUI, 4000);
        }

                        </p>
                    </div>
                    
                    <div class="px-8 bg-gradient-to-br from-white/30 to-white/10 p-10 rounded-[2.5rem] border border-white/40 shadow-sm relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b ${day.gradient}"></div>
                        <p class="text-stone-600 uppercase tracking-widest text-sm font-black mb-6 flex items-center gap-3">
                            <i data-lucide="sparkles" class="w-5 h-5 text-amber-500"></i> Pistas para profundizar
                        </p>
                        <p class="text-xl md:text-2xl text-stone-800 leading-loose font-serif">
                            ${day.saboreo}
                        </p>
                    </div>
                </div>
            `;
        }
        else if (currentStep === 4) { // Diálogo y Ofrenda
            // Comprobamos si ya fue entregado en una sesión anterior
            const yaEntregado = journalData[`${day.id}_entregado`];
            
            html += `<div id="dialogo-content" class="space-y-12 fade-in transition-all duration-1000 ${yaEntregado ? 'hidden' : ''}">`;
            
            day.dialogo.forEach(prompt => {
                const value = journalData[`${day.id}_${prompt.id}`] || '';
                html += `
                    <div class="space-y-5 group">
                        <label class="block text-2xl font-serif text-stone-900 italic font-semibold drop-shadow-sm leading-relaxed">
                            ${prompt.label}
                        </label>
                        <textarea
                            oninput="handleInputChange('${prompt.id}', this.value)"
                            class="w-full bg-white/40 rounded-[2rem] border-2 border-white/40 focus:border-white focus:bg-white/60 shadow-[inset_0_4px_15px_rgba(0,0,0,0.03)] outline-none resize-none p-8 text-stone-800 text-xl md:text-2xl font-serif leading-relaxed transition-all duration-500 placeholder:text-stone-500/40"
                            rows="4"
                            placeholder="Escribe desde el corazón...">${value}</textarea>
                    </div>
                `;
            });
            
            // Botón de Entregar a Dios
            html += `
                <div class="pt-10 flex justify-center fade-in">
                    <button onclick="entregarOracion()" class="group relative px-10 py-5 bg-gradient-to-r from-amber-200 to-yellow-500 rounded-full font-sans text-stone-900 font-bold shadow-[0_0_30px_rgba(251,191,36,0.3)] hover:shadow-[0_0_40px_rgba(251,191,36,0.5)] transition-all duration-500 hover:-translate-y-1 overflow-hidden tracking-widest uppercase text-sm border border-yellow-300">
                        <div class="absolute inset-0 bg-white/40 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-out"></div>
                        <span class="relative flex items-center gap-3">
                            <i data-lucide="send" class="w-5 h-5 -mt-1 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                            Entregar a Dios
                        </span>
                    </button>
                </div>
            </div>`;

            // Mensaje de éxito oculto por defecto (o visible si ya se entregó)
            html += `
                <div id="entregado-msg" class="${yaEntregado ? 'flex' : 'hidden opacity-0'} flex-col items-center justify-center space-y-8 text-center py-20 transition-opacity duration-1000">
                    <div class="w-24 h-24 bg-white/50 rounded-full flex items-center justify-center shadow-[0_0_60px_rgba(255,255,255,0.8)] border border-white">
                        <i data-lucide="feather" class="w-12 h-12 text-stone-700 drop-shadow-md"></i>
                    </div>
                    <h3 class="text-4xl font-serif text-stone-900 font-bold drop-shadow-sm">Tu oración ha sido acogida</h3>
                    <p class="text-stone-800 text-xl font-serif italic max-w-lg leading-relaxed">
                        Tus palabras, tus cargas y tus deseos más profundos ya descansan en el corazón de Dios. Camina en paz.
                    </p>
                </div>
            `;
        }
        else if (currentStep === 5) { // Cierre
            const val = journalData[`${day.id}_ancla`] || '';
            const canto = day.cantoCierre;
            html += `
                <div class="flex-grow flex flex-col items-center justify-center text-center space-y-14 fade-in w-full">
                    ${getIcon3DHtml("anchor", "from-stone-400 to-stone-600", "shadow-stone-500/30", "large")}
                    
                    <div class="bg-white/40 p-12 rounded-[3rem] shadow-[inset_0_0_30px_rgba(255,255,255,0.7)] border border-white/60 w-full max-w-xl space-y-8">
                        <p class="text-stone-600 uppercase tracking-[0.2em] text-sm font-black">Tu Palabra Ancla</p>
                        <p class="text-stone-800 text-xl font-serif leading-relaxed italic">
                            Después de todo lo meditado, ¿qué palabra o breve frase te regala el Espíritu para llevarte como un ancla durante el resto de tu día?
                        </p>
                        <input
                            type="text"
                            oninput="handleInputChange('ancla', this.value)"
                            class="w-full text-center bg-white/50 rounded-2xl shadow-[inset_0_4px_10px_rgba(0,0,0,0.05)] border-2 border-white/60 focus:border-stone-400 outline-none py-6 text-3xl font-serif text-stone-900 transition-all placeholder:text-stone-400/50 font-bold"
                            placeholder="Ej. 'Soy tuyo', 'Paz'..."
                            value="${val}"
                        />
                    </div>

                    <div class="w-full max-w-2xl mt-8">
                        <div class="flex items-center justify-center gap-3 mb-6">
                            <i data-lucide="music" class="w-5 h-5 text-stone-600"></i>
                            <p class="text-stone-600 uppercase tracking-[0.2em] text-sm font-black">Canto de Despedida</p>
                            <i data-lucide="music" class="w-5 h-5 text-stone-600"></i>
                        </div>
                        <div class="bg-white/40 p-6 rounded-[2rem] shadow-[0_8px_30px_rgba(0,0,0,0.06)] border border-white/60 flex flex-col items-center transition-transform hover:-translate-y-1 duration-500">
                            <h4 class="text-2xl font-serif text-stone-900 font-bold mb-5 drop-shadow-sm">${canto.title}</h4>
                            <div class="w-full aspect-video rounded-2xl overflow-hidden shadow-lg border-4 border-white/50 mb-6 bg-stone-200 relative group">
                                <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors pointer-events-none z-10"></div>
                                <iframe class="w-full h-full relative z-0" src="https://www.youtube.com/embed/${canto.id}?rel=0" title="${canto.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            </div>
                            <div class="bg-white/50 p-6 rounded-2xl w-full border border-white/50 shadow-[inset_0_2px_10px_rgba(255,255,255,0.8)] flex-grow flex items-center justify-center">
                                <p class="text-stone-800 text-xl font-serif italic text-center leading-loose font-medium">
                                    "${canto.lyrics}"
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        html += `</main>`;

        // Footer Navigation
        html += `
            <footer class="fixed bottom-6 left-0 right-0 px-4 z-50 flex justify-center pointer-events-none">
                <div class="bg-white/20 backdrop-blur-2xl border border-white/30 shadow-[0_15px_40px_rgba(0,0,0,0.3)] rounded-full p-2 flex gap-4 pointer-events-auto">
        `;

        if (currentStep > 0) {
            html += `
                <button onclick="prevStep()" class="px-6 py-4 rounded-full font-bold transition-all flex items-center gap-2 text-white hover:bg-white/20 hover:text-yellow-100 bg-white/10 shadow-sm border border-white/10">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i> Anterior
                </button>
            `;
        }

        const isLastStep = currentStep === 5;
        html += `
                    <button onclick="nextStep()" class="px-8 py-4 rounded-full font-bold text-white transition-all flex items-center gap-3 group transform hover:scale-[1.02] active:scale-95 bg-gradient-to-r ${day.gradient} shadow-lg ${day.shadow} border border-white/30 tracking-wide">
                        ${isLastStep ? 'Finalizar Guía' : 'Siguiente'} 
                        ${!isLastStep ? '<i data-lucide="chevron-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>' : '<i data-lucide="check-circle" class="w-5 h-5"></i>'}
                    </button>
                </div>
            </footer>
        </div>`;
        
        return html;
    }

    function render() {
        const app = document.getElementById('app');
        
        if (currentView === 'home') {
            app.innerHTML = renderHome();
        } else {
            app.innerHTML = renderDay();
            initBreathingAnimation();
        }
        
        lucide.createIcons();
    }

    // Inicialización
    window.onload = () => {
        render();
        document.body.classList.add('fade-in');
    };

</script>
</body>
</html>
