                    <div class="poem-box">
                        <div style="font-family:var(--font-body); font-size:1.5rem; line-height:2; color:var(--c-stone-800); font-style:italic; white-space:pre-line;">
                            ${day.oracionPoetica}
                        </div>
                    </div>
                </div>
            `;
        }
        else if (currentStep === 5) {
            const yaEntregado = journalData[`${day.id}_entregado`];
            
            html += `<div id="dialogo-content" class="content-stack-wide fade-in ${yaEntregado ? 'hidden' : ''}" style="transition:all 1s;">`;
            
            day.dialogo.forEach(prompt => {
                const value = journalData[`${day.id}_${prompt.id}`] || '';
                html += `
                    <div style="width:100%; text-align:left; display:flex; flex-direction:column; gap:1.5rem;">
                        <label style="font-family:var(--font-body); font-size:1.6rem; color:var(--c-stone-900); font-weight:600; font-style:italic; line-height:1.625;">
                            ${prompt.label}
                        </label>
                        <textarea
                            oninput="handleInputChange('${prompt.id}', this.value)"
                            class="dialog-textarea"
                            rows="4"
                            placeholder="Escribe desde el silencio de tu corazón...">${value}</textarea>
                    </div>
                `;
            });
            
            html += `
                <div style="padding-top:3rem; display:flex; justify-content:center; width:100%;" class="fade-in">
                    <button onclick="entregarOracion()" class="btn-submit">
                        <div class="btn-submit-glare"></div>
                        <span style="position:relative; display:flex; items-center; gap:1rem;">
                            <i data-lucide="send" style="width:1.25rem; height:1.25rem; margin-top:-2px;"></i>
                            Entregar a Dios
                        </span>
                    </button>
                </div>
            </div>`;

            html += `
                <div id="entregado-msg" class="${yaEntregado ? 'content-stack fade-in' : 'hidden opacity-0'}" style="transition:opacity 1s; padding:2.5rem 0;">
                    <div style="width:6rem; height:6rem; border-radius:50%; background:rgba(255,255,255,0.6); display:flex; align-items:center; justify-content:center; box-shadow:0 0 50px rgba(255,255,255,0.9); border:2px solid var(--c-white); margin-bottom:1rem;">
                        <i data-lucide="heart-handshake" style="width:3rem; height:3rem; color:var(--c-stone-700);"></i>
                    </div>
                    <h3 style="font-family:var(--font-serif); font-size:2.25rem; font-weight:700; color:var(--c-stone-900);">Tu oración ha sido acogida</h3>
                    <p style="font-family:var(--font-body); font-size:1.2rem; font-style:italic; color:var(--c-stone-800); max-width:36rem; line-height:1.625;">
                        Tus palabras, tus cargas y tus deseos más profundos ya descansan pacíficamente en el corazón de Dios.
                    </p>
                </div>
            `;
        }
        else if (currentStep === 6) {
            html += `
                <div class="content-stack fade-in" style="width:100%; max-width:48rem; margin:0 auto;">
                    ${getIcon3DHtml("book-heart", day.theme, "large")}
                    
                    <p class="text-body-lg" style="text-align:center;">
                        ${day.introPadreNuestro}
                    </p>

                    <div style="background:rgba(255,255,255,0.4); padding:3.5rem; border-radius:3rem; border:1px solid rgba(255,255,255,0.6); box-shadow:inset 0 2px 4px rgba(0,0,0,0.06); width:100%; position:relative; text-align:center;">
                        <i data-lucide="quote" style="position:absolute; top:2rem; left:2rem; width:2rem; height:2rem; color:rgba(28,25,23,0.1); transform:rotate(180deg);"></i>
                        <div style="font-family:var(--font-serif); font-size:1.4rem; color:var(--c-stone-800); line-height:2; font-style:italic; display:flex; flex-direction:column; gap:0.5rem; position:relative; z-index:10;">
                            <p>Padre nuestro, que estás en el cielo,</p>
                            <p>santificado sea tu Nombre;</p>
                            <p>venga a nosotros tu reino;</p>
                            <p>hágase tu voluntad en la tierra como en el cielo.</p>
                            <p>Danos hoy nuestro pan de cada día;</p>
                            <p>perdona nuestras ofensas,</p>
                            <p>como también nosotros perdonamos a los que nos ofenden;</p>
                            <p>no nos dejes caer en la tentación,</p>
                            <p>y líbranos del mal.</p>
                            <p style="font-weight:700; margin-top:1rem;">Amén.</p>
                        </div>
                    </div>
                </div>
            `;
        }
        else if (currentStep === 7) {
            const val = journalData[`${day.id}_ancla`] || '';
            const canto = day.cantoCierre;
            html += `
                <div class="content-stack fade-in" style="width:100%;">
                    ${getIcon3DHtml("anchor", "theme-anchor", "large")}
                    
                    <div class="content-box-inset" style="max-width:42rem; display:flex; flex-direction:column; gap:2.5rem; padding:3rem;">
                        <p class="eyebrow-label" style="margin-bottom:0;">Tu Palabra Ancla</p>
                        <p style="font-family:var(--font-body); font-size:1.35rem; color:var(--c-stone-800); line-height:2; font-style:italic;">
                            Después de todo lo meditado y sentido, ¿qué palabra o breve frase te regala el Espíritu para llevarte como un ancla en el bolsillo durante el resto de tu jornada?
                        </p>
                        <input
                            type="text"
                            oninput="handleInputChange('ancla', this.value)"
                            class="ancla-input"
                            placeholder="Ej. 'Soy tuyo', 'Paz'..."
                            value="${val}"
                        />
                    </div>

                    <div style="width:100%; max-width:48rem; margin-top:3rem;">
                        <div style="display:flex; align-items:center; justify-content:center; gap:1rem; margin-bottom:2rem;">
                            <i data-lucide="music" style="width:1.25rem; height:1.25rem; color:var(--c-stone-600);"></i>
                            <p class="eyebrow-label" style="margin-bottom:0;">Canto de Despedida</p>
                            <i data-lucide="music" style="width:1.25rem; height:1.25rem; color:var(--c-stone-600);"></i>
                        </div>
                        
                        <div class="canto-card" style="margin-bottom:4rem;">
                            <h4 style="font-family:var(--font-serif); font-size:1.875rem; font-weight:700; margin-bottom:1.5rem; color:var(--c-stone-900); text-align:center;">${canto.title}</h4>
                            <div class="video-box">
                                <div class="video-overlay"></div>
                                <iframe style="width:100%; height:100%; position:relative; z-index:0; border:none;" src="https://www.youtube.com/embed/${canto.id}?rel=0" title="${canto.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            </div>
                            <div class="lyrics-box">
                                <p style="font-family:var(--font-body); font-size:1.35rem; color:var(--c-stone-800); font-style:italic; line-height:2; text-align:center;">
                                    "${canto.lyrics}"
                                </p>
                            </div>
                        </div>

                        <div style="display:flex; align-items:center; justify-content:center; gap:1rem; margin-bottom:2.5rem;">
                            <div style="height:1px; background:rgba(255,255,255,0.4); flex-grow:1;"></div>
                            <i data-lucide="sun-dim" style="width:1.25rem; height:1.25rem; color:var(--c-stone-500);"></i>
                            <div style="height:1px; background:rgba(255,255,255,0.4); flex-grow:1;"></div>
                        </div>

                        <div class="grid-home" style="text-align:left;">
                            <div class="content-box-light" style="padding:2.5rem; display:flex; flex-direction:column; gap:1.25rem;">
                                <div style="position:absolute; top:-1.5rem; right:-1.5rem; width:8rem; height:8rem; border-radius:50%; filter:blur(24px); opacity:0.1;" class="${day.theme}"></div>
                                <p class="eyebrow-label" style="display:flex; align-items:center; gap:0.75rem; margin-bottom:0; font-size:0.7rem;">
                                    <i data-lucide="heart" style="width:1rem; height:1rem; color:var(--c-amber-600);"></i> Oración Final
                                </p>
                                <p style="font-family:var(--font-body); font-size:1.25rem; color:var(--c-stone-800); line-height:1.625; font-style:italic; position:relative; z-index:10;">
                                    "${day.oracionFinal}"
                                </p>
                            </div>
                            
                            <div class="content-box-light" style="padding:2.5rem; display:flex; flex-direction:column; gap:1.25rem;">
                                <div style="position:absolute; bottom:-1.5rem; left:-1.5rem; width:8rem; height:8rem; border-radius:50%; filter:blur(24px); opacity:0.1;" class="${day.theme}"></div>
                                <p class="eyebrow-label" style="display:flex; align-items:center; gap:0.75rem; margin-bottom:0; font-size:0.7rem;">
                                    <i data-lucide="map" style="width:1rem; height:1rem; color:var(--c-emerald-600);"></i> Compromiso Práctico
                                </p>
                                <p style="font-family:var(--font-body); font-size:1.25rem; color:var(--c-stone-800); line-height:1.625; font-weight:500; position:relative; z-index:10;">
                                    ${day.compromiso}
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        html += `</main>`;

        html += `
            <footer class="footer-nav">
                <div class="footer-glass">
        `;

        if (currentStep > 0) {
            html += `
                <button onclick="prevStep()" class="btn-prev">
                    <i data-lucide="chevron-left" style="width:1.25rem; height:1.25rem;"></i> <span class="hidden sm-inline" style="display:none;">Anterior</span>
                </button>
            `;
        }

        const isLastStep = currentStep === 7;
        html += `
                    <button onclick="nextStep()" class="btn-next ${day.theme} shadow-theme">
                        ${isLastStep ? 'Finalizar Guía' : 'Siguiente'} 
                        ${!isLastStep ? '<i data-lucide="chevron-right" style="width:1.25rem; height:1.25rem; transition:transform 0.3s;" class="hover-translate"></i>' : '<i data-lucide="check-circle" style="width:1.25rem; height:1.25rem;"></i>'}
                    </button>
                </div>
            </footer>
        </div>`;
        
        return html;
    }

    function render() {
        const app = document.getElementById('app');
        
        if (currentView === 'home') {
            app.innerHTML = renderHome();
            
            // Media query manual para mostrar/ocultar texto "Anterior"
            const style = document.createElement('style');
            style.innerHTML = `@media (min-width: 640px) { .sm-inline { display: inline !important; } }`;
            document.head.appendChild(style);
        } else {
            app.innerHTML = renderDay();
            initBreathingAnimation();
        }
        
        lucide.createIcons();
    }

    window.onload = () => {
        render();
        document.body.classList.add('fade-in');
    };

</script>
</body>
</html>
